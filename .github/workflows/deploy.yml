# Deploy nach PHASE-17-Plan (A.5), seit 2026-07-23 als CI-BUILD-DEPLOY:
# GitHub Actions BAUT alle Apps und schiebt nur das fertige .output per
# rsync auf den Server (Symlink-Flip + pm2 reload wie bei ZDT Stufe 2).
# Der App-Server (CX23, 2 Cores / 3,7 GB) baut damit NICHTS mehr — die
# frühere RAM-Regel (nie zwei Nuxt-Builds parallel, OOM-Kill 137, 3584-MB-
# Heap für platform) betrifft nur noch den ploi-Webhook-FALLBACK (s. u.).
#
# Feuert NUR, wenn der „Test"-Workflow auf main grün durchgelaufen ist —
# lint/typecheck bleiben bewusst Warnlampen (Beschluss A.10 #9).
# `workflow_dispatch` als manueller Hebel bleibt.
#
# Zugang: dedizierter SSH-Deploy-Key (Repo-Secret PLOI_SSH_KEY, ploi-User,
# authorized_keys auf app-prod); Host-Key ist unten GEPINNT (kein blindes
# ssh-keyscan zur Laufzeit). Ohne Secret ist der Deploy ein no-op.
#
# FALLBACK (Server baut selbst): die ploi-Deploy-Scripts der 4 Sites sind
# unverändert funktionsfähig — im Notfall (Actions down) in ploi den
# Deploy-Button drücken oder die Webhooks feuern
# (Secrets PLOI_DEPLOY_WEBHOOK_* existieren weiter, werden hier aber
# nicht mehr benutzt).
#
# Env Vars (NUXT_APPWRITE_KEY etc.) leben als Server-.env je Site —
# NIE im Repo; ploi „Quick Deploy" bleibt AUS.
#
# TLS der Landing (geloest 2026-07-27): der Apex braucht auf diesem Server
# KEIN Zertifikat mehr. Er laeuft als EINZIGER Host der Zone proxied ueber
# Cloudflare (Browser sieht das Cloudflare-Zertifikat), der Zonen-Modus ist
# fest auf "Full" gepinnt. Damit fasst ein Landing-Deploy die geteilte
# certbot-Lineage /etc/letsencrypt/live/pukalani.app (= das Wildcard-
# Zertifikat ALLER Kundenhosts) nie an. Regel: auf der ploi-Site pukalani.app
# NIEMALS "Add certificate"/"Force-renew" druecken — Details in
# docs/content/2.architektur/6.hosts-und-ports.md.
#
# Doku-Skip: ein main-Push mit AUSSCHLIESSLICH Doku-/CI-/Meta-Änderungen
# (docs/**, spikes/**, .github/**, *.md, …) baut identischen App-Output —
# der changes-Step vergleicht den auf Prod deployten Commit gegen den neuen
# Stand und überspringt dann. FAIL-SAFE: bei unbekanntem Prod-SHA, nicht
# auflösbarem Diff oder workflow_dispatch wird IMMER deployt.

name: Deploy

on:
  # Feuert, wenn Test ODER E2E fertig ist — deployt aber erst, wenn BEIDE für
  # denselben Commit grün sind (Vorprüfung im Job `gate`). Vorher hing der
  # Deploy nur an `Test`: am 2026-07-30 ging Etappe A der Umbenennung damit
  # live, obwohl der E2E zwei Läufe lang rot war (das Embed-Widget fand sein
  # iframe nicht). Ein Sicherheitsnetz, das man umgehen kann, ist keins.
  workflow_run:
    workflows: [Test, 'E2E (Appwrite)']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # Für die Vorprüfung: den Ausgang der ANDEREN Workflows desselben Commits
  # nachschlagen.
  actions: read

concurrency:
  group: deploy-sites
  cancel-in-progress: false

env:
  SERVER: 49.13.211.173
  SERVER_HOSTKEY: '49.13.211.173 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAVud82T4BSPvg5wH84jnRuP+JdG2hP52FAf+h9ckcCe'

jobs:
  # ── Vorprüfung: BEIDE Prüf-Workflows müssen für DIESEN Commit grün sein ────
  # Der Auslöser feuert zweimal (einmal je Workflow). Wer zuerst fertig ist,
  # findet den anderen noch laufend und bricht still ab; der zweite findet
  # beide grün und lässt den Deploy los. Deshalb ist das hier idempotent und
  # deployt trotzdem nur EINMAL — zusätzlich abgesichert durch die bestehende
  # concurrency-Gruppe.
  gate:
    runs-on: ubuntu-latest
    # ÖFFENTLICHES REPO (seit 2026-08-03): `workflow_run` feuert AUCH für
    # Prüfläufe fremder Pull Requests, und der Filter `branches: [main]` greift
    # dabei auf den HEAD-Branch des Auslösers — ein Fork, dessen Branch „main"
    # heißt, passiert ihn. Der Deploy läuft aber im Kontext DIESES Repos, also
    # MIT `PLOI_SSH_KEY`. Ohne die beiden Zusatzbedingungen könnte ein Fremder
    # damit eigenen Code auf den Produktionsserver schieben.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.event == 'push')
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - name: Sind Test UND E2E grün?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          # Der manuelle Hebel bleibt bewusst ohne Vorprüfung — er ist der
          # Notausgang, wenn die CI selbst klemmt.
          if [ "$MANUAL" = "true" ]; then
            echo "Manueller Start — Vorprüfung übersprungen."
            echo "go=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          go=true
          for wf in "Test" "E2E (Appwrite)"; do
            concl=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=100" \
              --jq "[.workflow_runs[] | select(.name==\"$wf\")] | sort_by(.created_at) | last | .conclusion // \"läuft-noch\"")
            echo "  $wf: $concl"
            [ "$concl" = "success" ] || go=false
          done
          if [ "$go" = "true" ]; then
            echo "✔ Beide grün für $SHA — Deploy startet."
          else
            echo "⏸ Noch nicht beide grün für $SHA — kein Deploy."
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"

  deploy:
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.go == 'true'
    env:
      EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v7
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0

      # Zweiter, unabhängiger Riegel: egal wie der Lauf zustande kam — was
      # nicht auf origin/main liegt, wird nicht ausgeliefert. Das hält auch
      # dann, wenn jemand die Auslöser-Bedingung oben später aufweicht.
      - name: Gehört dieser Commit zu main?
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$EXPECTED_SHA" origin/main; then
            echo "::error::$EXPECTED_SHA liegt NICHT auf origin/main — Deploy abgebrochen."
            exit 1
          fi
          echo "✔ $EXPECTED_SHA ist Teil von origin/main."

      # Nur-Doku/CI/Meta-Änderungen erkennen → Deploy überspringen.
      - name: Deploy nötig?
        id: changes
        run: |
          set -u
          IGNORE='^(docs/|spikes/|\.github/|\.claude/|\.codex/|.*\.md$|LICENSE$|\.gitignore$|\.editorconfig$)'
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manueller Trigger — deploye immer."
            echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          PROD=$(curl -fsS -m 15 https://comments.pukalani.app/api/health | jq -r '.build // empty' || true)
          if [ -z "$PROD" ] || ! git cat-file -e "${PROD}^{commit}" 2>/dev/null; then
            echo "Prod-SHA unbekannt oder nicht im Repo ('${PROD:-n/a}') — deploye sicherheitshalber."
            echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          FILES=$(git diff --name-only "$PROD" "$EXPECTED_SHA" || true)
          if [ -z "$FILES" ]; then
            echo "Keine Datei-Änderungen ggü. Prod ($PROD) — nichts zu deployen."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          RELEVANT=$(echo "$FILES" | grep -vE "$IGNORE" || true)
          # AUSNAHME von der docs/-Ignorierung: docs/content/ ist seit control/docs
          # (2026-07-28) Teil des control-BUILDS (Nuxt Content bettet die interne
          # Doku ins Server-Bundle ein) — Aenderungen dort MUESSEN deployen, sonst
          # bleibt control.pukalani.app/docs veraltet. grep -E kennt keine
          # Lookaheads, deshalb hier explizit zurueckgeholt statt im IGNORE-Regex.
          DOCS_CONTENT=$(echo "$FILES" | grep -E '^docs/content/' || true)
          RELEVANT=$(printf '%s\n%s\n' "$RELEVANT" "$DOCS_CONTENT" | grep -v '^$' || true)
          if [ -z "$RELEVANT" ]; then
            echo "Nur Doku/CI/Meta geändert — Deploy übersprungen:"; echo "$FILES" | sed 's/^/  /'
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "App-relevante Änderungen — deploye:"; echo "$RELEVANT" | sed 's/^/  /'
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: SSH einrichten (gepinnter Host-Key)
        if: steps.changes.outputs.skip != 'true'
        env:
          SSH_KEY: ${{ secrets.PLOI_SSH_KEY }}
        run: |
          set -u
          if [ -z "$SSH_KEY" ]; then
            echo "::error::Secret PLOI_SSH_KEY fehlt — CI-Build-Deploy kann nicht ausliefern."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SERVER_HOSTKEY" > ~/.ssh/known_hosts
          printf 'Host prod\n  HostName %s\n  User ploi\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n' "$SERVER" >> ~/.ssh/config

      - uses: pnpm/action-setup@v6
        if: steps.changes.outputs.skip != 'true'
      - uses: actions/setup-node@v7
        if: steps.changes.outputs.skip != 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        if: steps.changes.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      # Alle Apps auf DIESEM Runner bauen (sequenziell, 4c/16GB — kein
      # Server-RAM-Druck mehr), dann je App ausliefern + verifizieren.
      - name: Apps bauen
        if: steps.changes.outputs.skip != 'true'
        run: |
          set -eu
          for app in comments portfolio control platform marketing help; do
            echo "::group::Build $app"
            pnpm --filter "$app" build
            echo "::endgroup::"
          done

      - name: Ausliefern + verifizieren (rsync → Symlink-Flip → pm2 reload)
        if: steps.changes.outputs.skip != 'true'
        run: |
          set -eu
          # SITE = ploi-Site (Verzeichnis + Host fuer die Health-Probe),
          # SLOT  = Release-Verzeichnis unter /home/ploi/releases.
          # Seit dem Cutover (2026-07-26) heisst auch die Maschine control:
          # eigene ploi-Site 392163, Release-Slot releases/control.
          declare -A SITE=( [comments]=comments.pukalani.app [portfolio]=portfolio.pukalani.app [control]=control.pukalani.app [platform]=platform.pukalani.app [marketing]=pukalani.app [help]=help.pukalani.app )
          declare -A SLOT=( [comments]=comments [portfolio]=portfolio [control]=control [platform]=platform [marketing]=marketing [help]=help )
          for app in comments portfolio control platform marketing help; do
            site="${SITE[$app]}"
            echo "::group::Deploy $app → $site"
            RELEASES="/home/ploi/releases/${SLOT[$app]}"
            RELEASE="$RELEASES/$EXPECTED_SHA"
            rsync -az --delete "apps/$app/.output/" "prod:$RELEASE/"
            # ops-Configs liefert die CI selbst aus (rsync) — frueher hielt ein
            # `git pull` im Site-Checkout sie aktuell, aber ein voller Monorepo-
            # Checkout auf dem Server nur fuer zwei Config-Dateien ist keiner
            # mehr wert: die control-Site hat seit dem Cutover bewusst keinen,
            # die help-Site (2026-07-28) genauso.
            # (Die uebrigen Sites behalten ihre Checkouts fuer den ploi-
            # FALLBACK-Deploy — der macht sein eigenes git pull. Fuer control
            # und help gibt es diesen Fallback bewusst nicht; Ersatz sind die
            # Runbooks docs/runbooks/CONTROL-CUTOVER.md bzw. HELP-GO-LIVE.md.)
            rsync -az ops/ "prod:/home/ploi/$site/ops/"
            # Flip + Reload (ZDT Stufe 2). pm2 startOrReload findet den Prozess
            # ueber den NAMEN in der Ecosystem-Datei — bei einer Umbenennung
            # ersetzt es also NICHT, sondern startet daneben (zwei Prozesse,
            # ein Port, gemischte Builds — passiert beim studio→control-Rename,
            # gemessen 6:4 bei 10 Aufrufen). Darum unten die Serien-Probe.
            # MERKE fuer kuenftige Umzuege: pm2 reload behaelt den GESPEICHERTEN
            # Script-Pfad — ein Pfadwechsel in der Ecosystem-Datei kommt per
            # reload nie an (der Prozess serviert weiter den alten Build, die
            # Serien-Probe unten faengt es). Dann braucht es EINMALIG
            # `pm2 delete <name>` vor dem startOrReload.
            PROC=$(echo "$site" | tr -d .)
            # Der pm2-Prozessname ist IMMER die Site ohne Punkte (so heissen
            # sie in den Ecosystem-Dateien: comments.pukalani.app →
            # commentspukalaniapp, pukalani.app → pukalaniapp). Nicht aus dem
            # App-Namen zusammensetzen — bei marketing waere daraus
            # "marketingpukalaniapp" geworden und der Heiler haette still
            # nichts gefunden.
            # pm2-heal.sh (3. Falle, 2026-07-26): loescht den Prozess vorab,
            # wenn er errored ist oder sein eingefrorener cwd nicht mehr
            # existiert (Erststart-Shell-cwd zeigte auf die geloeschte
            # studio-Site → spawn-ENOENT, portfolio down). Ecosystem-Dateien
            # setzen seitdem cwd: CURRENT — der Heiler bleibt als Backstop.
            ssh prod "set -eu
              ln -s '$RELEASE' '$RELEASES/current.tmp'
              mv -Tf '$RELEASES/current.tmp' '$RELEASES/current'
              bash /home/ploi/$site/ops/pm2-heal.sh $PROC
              pm2 startOrReload /home/ploi/$site/ops/ecosystem-$app.config.cjs --update-env
              pm2 save
              ls -1dt $RELEASES/*/ 2>/dev/null | tail -n +6 | xargs -r rm -rf
              echo '$app geflippt auf $EXPECTED_SHA'"
            echo "::endgroup::"

            # DREI Treffer in Folge, nicht einer. Eine einzelne Abfrage beweist
            # nur, dass IRGENDEIN Prozess hinter dem Host den neuen Build hat —
            # nicht, dass alle ihn haben. Genau daran ist der Rename-Deploy
            # vorbeigelaufen: zwei Prozesse auf einem Port, einer alt, und die
            # erste Abfrage traf zufaellig den neuen.
            echo "[$app] Erwarte Commit $EXPECTED_SHA auf https://$site/api/health (3x in Folge) …"
            ok=""; streak=0
            for i in $(seq 1 20); do
              BUILD=$(curl -fsS -m 15 "https://$site/api/health" | jq -r '.build // empty' || true)
              if [ "$BUILD" = "$EXPECTED_SHA" ]; then
                streak=$((streak + 1))
                if [ "$streak" -ge 3 ]; then
                  echo "[$app] ✔ Prod läuft durchgängig auf $BUILD"; ok=1; break
                fi
                echo "[$app]   ($i/20) Treffer $streak/3 …"
              else
                [ "$streak" -gt 0 ] && echo "[$app]   ($i/20) Serie gerissen — '$BUILD' statt $EXPECTED_SHA (mehrere Prozesse am Port?)"
                streak=0
                echo "[$app]   ($i/20) Prod meldet '${BUILD:-n/a}' — warte 5 s …"
              fi
              sleep 5
            done
            if [ -z "$ok" ]; then
              echo "::error::[$app] Prod hat $EXPECTED_SHA nicht stabil erreicht — pm2 list prüfen (verwaister Prozess am selben Port?)."
              exit 1
            fi
          done

      # TLS-Nachkontrolle: liefert JEDER Host noch ein passendes Zertifikat?
      # Die Health-Probe oben prüft nur die Hosts, die gerade deployt wurden —
      # ein zerschossenes Zertifikat auf einem ANDEREN Host (geteilte
      # certbot-Lineage, Vorfall 2026-07-27) bliebe sonst unentdeckt.
      # Läuft auch, wenn ein App-Schritt vorher rot war: dann ist die
      # TLS-Aussage besonders wichtig.
      - name: TLS aller Hosts prüfen
        if: always() && steps.changes.outputs.skip != 'true'
        run: node scripts/ops/verify-tls.mjs

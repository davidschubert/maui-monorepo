# E2E gegen eine ECHTE Appwrite-Instanz (OPEN-ITEMS Idee 4): der Runner
# startet den geschnittenen Appwrite-Stack (ci/appwrite/ — traefik, appwrite,
# realtime, databases-/deletes-Worker, mariadb, redis; Rest des offiziellen
# Compose bleibt aus), scripts/ci/appwrite-setup.mjs erledigt die Console-
# Schritte (Account/Projekt/Key/Platform + .env), dann bootstrap --seed und
# die Playwright-Suite — inklusive Realtime-Spec (env-gated, läuft hier,
# weil die .env existiert). themes-visual skippt in CI (Baselines -darwin).
name: E2E (Appwrite)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Früh starten — mariadb-Erstinitialisierung + Appwrite-Boot laufen
      # parallel zu pnpm install
      - name: Appwrite-Stack starten
        working-directory: ci/appwrite
        run: |
          docker compose --env-file ci.env --project-name appwrite-ci up -d \
            traefik appwrite appwrite-realtime \
            appwrite-worker-databases appwrite-worker-deletes \
            mariadb redis

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Auf Appwrite warten
        run: |
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/v1/health/version || true)
            if [ "$code" = "200" ]; then
              echo "Appwrite bereit: $(curl -s http://localhost:8080/v1/health/version)"
              exit 0
            fi
            sleep 5
          done
          echo '::error::Appwrite nach 450s nicht erreichbar'
          docker compose --env-file ci/appwrite/ci.env --project-name appwrite-ci -f ci/appwrite/docker-compose.yml logs --tail 80 appwrite mariadb
          exit 1

      - name: Console-Setup (Projekt, Key, Platform, .env)
        run: node scripts/ci/appwrite-setup.mjs --endpoint http://localhost:8080/v1 --app apps/comments

      - name: Bootstrap (DB, Bucket, Migrationen) + Seed
        run: pnpm --filter comments run bootstrap --seed

      # Der GELDPFAD gegen die frisch migrierte Instanz (Audit-Befund
      # 2026-08-02). Warum hier und nicht als Unit-Test: `grantEventTicket`
      # schrieb monatelang eine Spalte, die es nach E8-3 nicht mehr gab —
      # Appwrite antwortete 400, es entstand kein Ticket, der Zahlende bekam
      # 403. Die Suite blieb grün, weil sie den Row-Store MOCKT, und ein Mock
      # hat kein Schema. Erst eine echte Datenbank sagt, ob die Felder
      # existieren; genau die steht hier schon.
      - name: Paid-Ticket-Beweis (echtes Schema)
        run: |
          cd packages/events
          node --experimental-strip-types --env-file=../../apps/comments/.env \
            scripts/verify-paid-ticket.mjs

      # ── DIE LIVE-BEWEISE (F30) ────────────────────────────────────────────
      # Im Repo liegen zwei Dutzend `verify-*.mjs`. Bis heute lief davon in CI
      # NUR der Paid-Ticket-Beweis darüber — alles andere prüfte, wer zufällig
      # daran dachte. Genau so blieben ein toter Geldpfad und ein Isolations-
      # Loch wochenlang unentdeckt, OBWOHL es für beide einen Beweis gab.
      #
      # Hier hängen die Beweise, die OHNE zusätzliche Infrastruktur laufen:
      # kein Dev-Server, keine zweite Appwrite, kein Control-Plane-Projekt —
      # sie brauchen nur die frisch migrierte Instanz, die zwei Schritte weiter
      # oben schon steht. Jeder bekommt einen EIGENEN Schritt: ein roter Lauf
      # soll am Schritt-Namen zeigen, WELCHE Zusage gebrochen ist, statt in
      # einem Sammel-Schritt zu verschwinden.
      #
      # Alle fünf sind idempotent und räumen ihre Zeilen selbst wieder weg
      # (auch im Fehlerfall) — sie dürfen deshalb gegen dieselbe Instanz
      # laufen, die gleich die Playwright-Suite benutzt.
      #
      # Was hier NICHT steht, steht in docs/referenz/LIVE-BEWEISE.md mitsamt
      # dem Grund (die meisten brauchen einen Platform-Dev-Server mit den
      # Wegwerf-Communities kunde-a/kunde-b im Control Plane — die gibt es in
      # CI noch nicht).

      - name: Beweis — Mandanten-Isolation comments/reports/pages (DB-Ebene)
        run: |
          cd packages/comments
          node --env-file=../../apps/comments/.env \
            scripts/verify-pool-isolation.mjs

      - name: Beweis — Mandanten-Isolation posts/votes/polls (DB-Ebene)
        run: |
          cd packages/posts
          node --env-file=../../apps/comments/.env \
            scripts/verify-pool-isolation.mjs

      # C18: „sieht ein GAST die Inhalte noch?" — gelesen mit einem echten
      # Gast-Client (Endpoint + Projekt, KEIN Key), also an unserem Code vorbei.
      - name: Beweis — Sichtbarkeit je Community (Gast-Sicht, beide Richtungen)
        run: |
          cd packages/control
          node --experimental-strip-types --env-file=../../apps/comments/.env \
            scripts/verify-audience-flip.mjs

      # A4/A5: die Presence-Grenze, direkt gegen die Presences-API gelesen.
      # PLATFORM_PORT zeigt bewusst auf einen toten Port: „Akt 2" (der Weg durch
      # Middleware + Heartbeat) braucht einen Platform-Dev-Server, den es hier
      # nicht gibt, und wird dann sauber übersprungen. Der Port steht explizit
      # da, damit das Überspringen eine ENTSCHEIDUNG ist und nicht davon
      # abhängt, dass zufällig nichts auf 3006 lauscht.
      - name: Beweis — Presence-Grenze (Akt 1, Mechanismus an der Appwrite-API)
        env:
          PLATFORM_PORT: '39999'
        run: |
          cd packages/core
          node --env-file=../../apps/comments/.env \
            scripts/verify-presence-boundary.mjs

      # Changelog-Einträge (v0.1…): der Smoke-Test prüft die öffentliche
      # Vollhistorie — auf der frischen Instanz sonst leer
      - name: Changelog seeden
        run: node --env-file=apps/comments/.env packages/admin/scripts/seed-changelog.mjs

      # Seit 2026-07-31 GEBÜNDELTES Chromium statt System-Chrome (playwright.
      # config): auf macOS erbten GoogleUpdater/crashpad das stdout-Socketpair
      # des Workers und hängten die lokale Suite. Preis: der Browser ist auf
      # ubuntu-latest NICHT vorinstalliert und braucht diesen Schritt.
      - name: Playwright-Browser (Chromium)
        run: pnpm --filter comments exec playwright install --with-deps chromium

      - name: Playwright-E2E (inkl. Realtime gegen echte Instanz)
        run: pnpm --filter comments exec playwright test

      - name: Playwright-Artefakte sichern
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: apps/comments/test-results
          retention-days: 7

      # Gate G1/S1 (M4): create-site end-to-end gegen die echte Wegwerf-
      # Instanz — Console-REST (Org→Projekt→Keys→Platform), .env, Bootstrap
      # mit manifest-gefilterten Migrationen, check:manifests als Schlussgate.
      # Console-Zugang = der CI-Account aus appwrite-setup.mjs.
      - name: Gate G1 — create-site (S1, Console-Provisionierung)
        env:
          APPWRITE_CONSOLE_EMAIL: ci@example.com
          APPWRITE_CONSOLE_PASSWORD: ci-console-password-2026
        run: pnpm create-site g1-probe --endpoint http://localhost:8080/v1 --products themes,admin,comments,moderation,activity

      # F19 — der Anstoß am Metadaten-Cache, der die INDEX-Anlage rettet. Genau
      # dieser 400er (`column_not_available` trotz Spalten-Status 'available')
      # hat die CI-E2E schon zweimal live erwischt; `indexStep`/`withIndexRetry`
      # sind die Antwort darauf. Der Beweis stellt den vergifteten Cache-Zustand
      # exakt her (Redis-Eintrag zurück auf 'processing') und fährt BEIDE Fälle:
      # ohne Anstoß muss der Index scheitern, mit Anstoß durchkommen.
      #
      # Steht bewusst GANZ HINTEN: er ist mit ~25 s der langsamste Beweis, und
      # er fasst als einziger die Appwrite-Interna an (Wegwerf-Tabelle + Redis).
      # Die billigen Zusagen sollen vorher scheitern, nicht danach.
      #
      # Den Redis-Container fragt `docker compose` selbst ab, statt den Namen
      # <projekt>-<dienst>-<n> nachzubauen: eine geratene Konvention wäre eine
      # stille Kopplung an compose, und ein falscher Name würde hier als
      # PRODUKTFEHLER aussehen und jeden Deploy blockieren. Fehlt der
      # Container, bricht der Schritt mit eigener Ansage ab.
      - name: Beweis — Index-Anstoß überlebt vergifteten Metadaten-Cache (F19)
        run: |
          REDIS=$(docker compose --env-file ci/appwrite/ci.env \
            --project-name appwrite-ci -f ci/appwrite/docker-compose.yml \
            ps -q redis)
          if [ -z "$REDIS" ]; then
            echo '::error::Redis-Container des CI-Stacks nicht gefunden'
            exit 1
          fi
          APPWRITE_REDIS_CONTAINER="$REDIS" \
            node --experimental-strip-types --env-file=apps/comments/.env \
              packages/media/scripts/verify-index-nudge.mjs

      - name: Stack-Logs bei Fehler
        if: failure()
        run: docker compose --env-file ci/appwrite/ci.env --project-name appwrite-ci -f ci/appwrite/docker-compose.yml logs --tail 120 appwrite appwrite-realtime appwrite-worker-databases mariadb

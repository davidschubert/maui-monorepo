packages:
  - 'packages/*'
  - 'apps/*'
  - 'docs'

onlyBuiltDependencies:
  - '@parcel/watcher'
  - esbuild
  - vue-demi

# EINE h3-Version im Baum. Nicht Kosmetik, sondern die Bedingung dafür, dass
# der Typecheck überhaupt reproduzierbar ist:
# nitropack 2.13.4 bringt h3 1.15.11, und über Vite 8 kommt
# `@vitejs/devtools` → devtools-kit → devframe → h3 2.0.1-rc dazu. Bei ZWEI
# Kopien entscheidet pnpms Hoisting, welche unter `.pnpm/node_modules/h3`
# landet; `nuxi prepare` schreibt GENAU DIE in die `paths` der generierten
# tsconfigs, während nitros eigene Typen bei h3 1 bleiben. Gewinnt h3 2, ist
# jedes Event, das eine Route an einen geteilten Helfer weiterreicht, ein
# Typfehler — gemessen platform 1102, control 944, comments 1261. Das Hoisting
# steht NICHT im Lockfile: dieselbe Lockfile war auf einer Maschine grün und
# auf der anderen rot (nachgestellt, indem nur der Hoist-Symlink umgehängt
# wurde). Ein Override auf `vite: ^7` beseitigt das NICHT — Vite 8 hängt als
# auto-installierter Peer (`autoInstallPeers`) mit drin und der Baum wird
# dadurch nur noch gemischter (zwei @nuxt/vite-builder-Varianten).
# Deshalb direkt an h3. Preis, bewusst bezahlt: devframe importiert `H3`,
# `defineHandler` und `toNodeHandler` — h3-2-APIs, die h3 1 nicht hat. devframe
# ist Vite-DEVTOOLS-Zubehör (über @unhead/bundler → @vitejs/devtools-kit); der
# Einstiegspunkt `@vitejs/devtools` ist gar nicht installiert, es wird also nie
# geladen — Dev-Server, alle vier Prod-Builds und der Browser bleiben sauber.
# Sollte Vite-Devtools je wirklich gebraucht werden, ist das der Moment, den
# Vite-8-Sprung als EIGENE Entscheidung anzugehen (Vite 7 kennt devframe nicht).
# Wächter: `pnpm check:single-copy`.
overrides:
  h3: ^1.15.11

# `ipx` ist eine OPTIONALE Abhängigkeit von @nuxt/image und wird ausschliesslich
# vom eingebauten `ipx`-Anbieter gebraucht — also von dem, der die Bilder AUF DEM
# APP-SERVER rechnet. Genau das will dieses Repo nicht (C14): transformiert wird
# in Appwrite (`/preview`), der eigene Anbieter `appwrite` baut nur URLs.
# Ohne diesen Ausschluss zieht ipx `sharp` mit — und sharp bringt die ganze
# `@img/sharp-*`-Plattform-Matrix (26 Pakete, ~1.400 Lockfile-Zeilen und
# libvips-Binaries) in einen Baum, der sie nie ausführt.
# WICHTIG: Wer je den ipx-Anbieter will, muss diesen Eintrag zuerst entfernen —
# @nuxt/image meldet sonst zur Build-Zeit ein fehlendes Modul.
ignoredOptionalDependencies:
  - ipx

catalog:
  '@iconify-json/ph': ^1.2.2
  '@iconify-json/circle-flags': ^1.2.5
  '@iconify-json/lucide': ^1.2.118
  '@nuxt/content': ^3.15.1
  '@nuxt/eslint-config': ^1.15.2
  # MUSS zur Nuxt-Generation passen: 10.4 gehört zu Nuxt 4.4 und zieht
  # @unhead/vue 2 + vue-router 5.1 (und darüber pinia 3) in den Baum, während
  # Nuxt 4.5 auf unhead 3 + vue-router 5.2 steht. 10.6 verlangt @nuxt/kit
  # ^4.5.1, unhead ^3.2.3, vue-router ^5.2.0, h3 ^1.15.11 — dieselbe Linie.
  '@nuxtjs/i18n': ^10.6.0
  eslint: ^10.8.0
  appwrite: ^26.2.0
  node-appwrite: ^27.1.0
  '@types/node': ^22.18.0
  nuxt: ^4.5.1
  '@nuxt/ui': ^4.10.0
  # EXAKT gepinnt, ohne Caret — und das ist hier keine Vorsicht, sondern die
  # Bedingung. Tiptap liegt bereits als auto-installierter optionaler Peer von
  # @nuxt/ui im Baum (3.27.1, genau eine Kopie je Paket). Wir nehmen NUR
  # `extension-mention` direkt auf, weil `UEditorMentionMenu` einen
  # Mention-Knoten einfügt und der von Haus aus zu `[@ id="…" label="…"]`
  # serialisiert — unser Parser reicht das roh durch. Der eigene
  # `renderMarkdown`-Handler (PostBodyEditor.vue) macht `@handle` daraus, und
  # `renderMarkdown` ist ein EXTENSION-FELD: `.configure()` erreicht es nicht,
  # nur `.extend()`. Darum die direkte Abhängigkeit.
  # EINE Caret-Range würde hier alles kaputt machen: `^3.27.1` erlaubt 3.28,
  # @nuxt/ui bliebe bei 3.27.1, und ZWEI Kopien von `@tiptap/core` heißen,
  # dass Tiptap Extensions aus der fremden Kopie nicht mehr erkennt. Bei einem
  # @nuxt/ui-Bump gehört diese Zeile mitgezogen — `pnpm check:single-copy`
  # (Liste enthält `@tiptap/core`) ist der Wächter.
  '@tiptap/extension-mention': 3.27.1
  # Bild-Naht Schritt 2 (C14). 2.1.0 haengt NUR an h3 ^1.15.11 + @nuxt/kit
  # ^4.5.1 — also genau an der Linie, die `overrides.h3` und `nuxt` hier
  # ohnehin festhalten. `ipx` (und darueber `sharp`) ist eine OPTIONALE
  # Abhaengigkeit und wird nur vom ipx-Anbieter gebraucht; dieses Repo
  # transformiert in Appwrite, nicht auf dem App-Server.
  '@nuxt/image': ^2.1.0
  # MUSS zur Range von @nuxt/ui passen (4.10.0 verlangt ^4.3.2), sonst liegen
  # zwei Tailwind-Kopien im Baum. Steht hier, weil `tailwindcss` DIREKT gebraucht
  # wird: packages/core/app/assets/css/main.css und docs/app/assets/css/main.css
  # machen `@import "tailwindcss"`, und ein CSS-Import löst relativ zur DATEI auf
  # — also gegen packages/core/node_modules bzw. docs/node_modules. Nur transitiv
  # über @nuxt/ui reicht dafür nicht: je nach Hoisting landet tailwindcss allein
  # unter `.pnpm/node_modules/`, und dann wirft JEDER lokale Dev-Server auf JEDER
  # SSR-Seite 500 „Can't resolve 'tailwindcss'". Prod-Builds trifft es nicht —
  # der Defekt ist also nur lokal sichtbar und deshalb doppelt tückisch.
  tailwindcss: ^4.3.2
  '@nuxtjs/mdc': ^0.22.2
  # Fest gekoppelt: @pinia/nuxt 0.11.x verlangt pinia ^3, 1.0.x verlangt ^4 —
  # einzeln bewegt sich keines von beiden ohne unerfuellten Peer.
  '@pinia/nuxt': ^1.0.1
  pinia: ^4.0.2
  # MUSS zu dem mitwandern, was nuxt intern verlangt (4.5.1 → @vue/shared
  # ^3.5.40). Bleibt der Katalog darunter, hält pnpm für die Workspace-Pakete
  # die alte vue-Version und nuxt zieht daneben die neue: mit ZWEI vue-Kopien
  # läuft der Nitro-Externals-Tracer im Zyklus vue → @vue/server-renderer → vue
  # und der Prod-Build stirbt an ENAMETOOLONG.
  vue: ^3.5.40
  typescript: ^5.9.3
  vitest: ^4.1.8
  vue-tsc: ^3.3.8
  zod: ^4.4.3
  jiti: ^2.7.0
  nodemailer: ^7.0.0
  ioredis: ^5.9.0
  '@types/nodemailer': ^7.0.0
  stripe: ^18.0.0
  '@playwright/test': ^1.50.0
